; PlatformIO build for the typewriter firmware.
;
; Soldered's Arduino board package ships prebuilt ESP32 system libraries whose
; IRAM use leaves no room for Bluetooth and Wi-Fi together (5 KB short). The
; pioarduino platform rebuilds those libraries from custom_sdkconfig, here moving
; FreeRTOS's and the ring buffer's non-interrupt functions from IRAM to flash,
; and letting TLS allocate from PSRAM (internal RAM is tight with both radios).
; (CONFIG_ESP32_REV_MIN_3 would free more, but this hybrid build then calls a
; flash-resident memset while the flash cache is off and crashes at boot.)
; The first build takes a while; later ones are quick.
;
;   tools/.venv/bin/pio run -t upload        build and flash
;   tools/.venv/bin/pio device monitor       serial log (or tools/log.py)

[platformio]
src_dir = firmware/typewriter
lib_dir = lib

[env:inkplate5v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.variants_dir = variants
board_build.variant = Inkplate
build_flags =
    -DARDUINO_INKPLATE5V2
    -DBOARD_HAS_PSRAM
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
    CONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
lib_deps =
    InkplateLibrary=file:///Users/charlsy/Documents/Arduino/libraries/InkplateLibrary
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3
upload_port = /dev/cu.usbserial-110
upload_speed = 460800
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
